# Codemagic CI/CD for Basir.
#
# Why Codemagic for this repo
# ───────────────────────────
# Building an iOS app needs macOS + Xcode. The developer's primary
# machine is Linux/Windows, so we use Codemagic's hosted macOS
# instances. The free tier (500 build minutes/month at the time of
# writing) is plenty for a project this size: a clean build runs in
# ~3-5 minutes.
#
# How to use this file
# ────────────────────
# 1. Push this repo to GitHub (already done).
# 2. Go to codemagic.io → sign in with GitHub.
# 3. "Add application" → select bellinghamfolks-debug/Vceer2.
# 4. Codemagic detects codemagic.yaml and shows the workflows below.
# 5. Trigger the `ios-simulator-build` workflow manually for the first
#    build (or push to a watched branch).
# 6. To enable code-signed device builds, add an Apple Developer
#    account in Codemagic → Teams → Integrations and uncomment the
#    `ios-device-build` workflow.
#
# What this file does NOT do (yet)
# ────────────────────────────────
# - The Android workflow stays on GitHub Actions (.github/workflows/
#   build-apk.yml). Codemagic could build Android too, but the existing
#   Actions setup works and is free.
# - App Store / TestFlight publishing is set up but disabled by default
#   (needs Apple Developer credentials uploaded to Codemagic first).
#
# Which workflows run automatically
# ─────────────────────────────────
# v3.3 — every push to claude/**, main, or master triggers BOTH:
#   1. ios-simulator-build  → fast .app smoke test (~3-5 min)
#   2. ios-unsigned-ipa     → real .ipa archive (~5-8 min)
# The IPA is emailed + posted as a Codemagic artifact so the user
# always has a downloadable installer-shaped file. The simulator
# build catches compile errors a couple of minutes earlier in case
# the IPA archive step would have caught the same regression later.

workflows:

  ios-simulator-build:
    name: Basir iOS — simulator build (no Apple Developer account needed)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 15.4
      vars:
        XCODE_PROJECT_DIR: "ios"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/**"
          include: true
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true

    scripts:
      - name: Install XcodeGen
        # XcodeGen creates the .xcodeproj from ios/project.yml so we
        # never commit a binary Xcode project to git.
        script: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        script: |
          cd $XCODE_PROJECT_DIR
          xcodegen generate
          ls -la Basir.xcodeproj/

      - name: Build for iOS Simulator
        # Unsigned build for an iPhone 15 simulator. Catches compile
        # errors, missing imports, Swift version mismatches — the same
        # role the Android `assembleDebug` task plays for the APK.
        script: |
          cd $XCODE_PROJECT_DIR
          xcodebuild build \
            -project Basir.xcodeproj \
            -scheme Basir \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            | xcpretty || exit 1

      - name: Verify .app bundle was produced
        script: |
          cd $XCODE_PROJECT_DIR
          APP_PATH="build/Build/Products/Debug-iphonesimulator/Basir.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Build did not produce $APP_PATH"
            exit 1
          fi
          echo "✅ Built $APP_PATH"
          du -sh "$APP_PATH"

    artifacts:
      - ios/build/Build/Products/Debug-iphonesimulator/Basir.app
      - ios/build/Build/Products/Debug-iphonesimulator/Basir.app.dSYM

    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: false
          failure: true

  # ---------------------------------------------------------------------
  # Device-ready unsigned IPA. Boots the .app into an IPA wrapper that
  # can be inspected and (with proper signing later) installed on a real
  # iPhone via AltStore / Sideloadly / Xcode resigning.
  #
  # v3.3 — promoted to auto-trigger. Every push to the watched branches
  # now produces an IPA email + downloadable artifact in addition to the
  # simulator smoke build above. The two workflows run in parallel on
  # Codemagic so the IPA never blocks the faster simulator feedback.
  # ---------------------------------------------------------------------
  ios-unsigned-ipa:
    name: Basir iOS — unsigned IPA (auto-built on every push)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 15.4
      vars:
        XCODE_PROJECT_DIR: "ios"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/**"
          include: true
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $XCODE_PROJECT_DIR
          xcodegen generate

      - name: Stamp build number from commit count
        # Codemagic's UI lets us set CFBundleVersion via agvtool, which
        # keeps every IPA distinguishable in TestFlight / archive
        # records. The marketing version (CFBundleShortVersionString)
        # stays at whatever Info.plist declares.
        script: |
          cd $XCODE_PROJECT_DIR
          BUILD_NUMBER=$(git rev-list HEAD --count)
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Archive (unsigned, for inspection or external resigning)
        script: |
          cd $XCODE_PROJECT_DIR
          xcodebuild archive \
            -project Basir.xcodeproj \
            -scheme Basir \
            -configuration Release \
            -archivePath build/Basir.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit 1

      - name: Wrap .app into unsigned .ipa
        # An unsigned IPA cannot install on a stock iPhone without
        # further signing. It DOES install via AltStore, Sideloadly, or
        # by re-signing with an Apple Developer certificate in Xcode's
        # "Archives" → "Distribute App" → "Custom" pipeline. The
        # ios-app-store-build workflow further down replaces this once
        # a developer account is connected.
        script: |
          cd $XCODE_PROJECT_DIR/build
          mkdir -p Payload
          cp -r Basir.xcarchive/Products/Applications/Basir.app Payload/
          # Name the IPA after the commit SHA so successive builds
          # don't overwrite each other when downloaded into the same
          # folder.
          SHORT_SHA=$(git -C .. rev-parse --short HEAD)
          IPA_NAME="Basir-${SHORT_SHA}-unsigned.ipa"
          zip -qr "$IPA_NAME" Payload
          du -sh "$IPA_NAME"
          rm -rf Payload
          # Also drop a stable-named symlink so the artifacts: glob
          # picks the latest build without needing the SHA.
          cp "$IPA_NAME" Basir-unsigned.ipa

    artifacts:
      - ios/build/Basir-unsigned.ipa
      - ios/build/Basir-*-unsigned.ipa
      - ios/build/Basir.xcarchive

    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------
  # Real distribution build. DISABLED until you upload an Apple
  # Developer account to Codemagic. To enable:
  #
  # 1. Codemagic → Teams → Integrations → Developer Portal → Connect.
  # 2. Codemagic → App settings → Code signing identities → upload
  #    your iOS Distribution certificate (.p12) and provisioning
  #    profile, OR enable automatic code signing (Codemagic creates
  #    them via the API).
  # 3. Remove the `when` block below to make this workflow active.
  # 4. Push to the `release/ios` branch to trigger a TestFlight build.
  # ---------------------------------------------------------------------
  # ios-app-store-build:
  #   name: Basir iOS — App Store / TestFlight (signed)
  #   instance_type: mac_mini_m2
  #   max_build_duration: 60
  #   integrations:
  #     app_store_connect: Basir App Store Connect API
