plugins {
    id 'com.android.application'
}

android {
    namespace 'com.basir.ai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.basir.ai'
        minSdk 23
        targetSdk 34
        versionCode 58
        versionName '3.3.4'
    }

    // v3.3.2 — AGP 8.x stopped generating BuildConfig by default.
    // The ConversionDiagnostic header was printing "basir-? (code 0)"
    // because its reflection bridge couldn't find the class. Turn it
    // back on so version_name / version_code reach the diagnostic.
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
