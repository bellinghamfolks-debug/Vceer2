name: Build Mokafeefah Clicker APK

on:
  workflow_dispatch:
  push:
    branches: [ mokafeefah-recovery ]
    paths:
      - 'mokafeefah/**'
      - '.github/workflows/build-mokafeefah-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        working-directory: mokafeefah
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: List build outputs
        if: always()
        working-directory: mokafeefah
        run: find app/build/outputs -type f -name "*.apk" || echo "no apk yet"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MokafeefahClicker-debug-apk
          path: mokafeefah/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
