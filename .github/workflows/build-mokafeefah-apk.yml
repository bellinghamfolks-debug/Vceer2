name: Build Mokafeefah Clicker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'claude/**'
      - 'mokafeefah-**'
    paths:
      - 'mokafeefah/**'
      - '.github/workflows/build-mokafeefah-apk.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'mokafeefah/**'
      - '.github/workflows/build-mokafeefah-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK (mokafeefah)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mokafeefah

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight project structure
        run: |
          set -e
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mokafeefah/clicker/MainActivity.java
          test -f app/src/main/java/com/mokafeefah/clicker/ClickerService.java
          test -f app/src/main/java/com/mokafeefah/clicker/LikedMembersDb.java
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/layout/activity_main.xml
          echo "Preflight OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper for mokafeefah
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x ./gradlew
          ls -la gradle/wrapper/
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: List build outputs
        if: always()
        run: |
          echo "=== APK outputs ==="
          find app/build/outputs -type f -name "*.apk" 2>/dev/null || echo "no apk yet"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mokafeefah-debug-apk
          path: mokafeefah/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
