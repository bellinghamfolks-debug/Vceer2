# XcodeGen project specification for Basir iOS.
#
# Why XcodeGen
# ────────────
# An Xcode project (.xcodeproj) is a complex binary directory that
# diff-engines hate and that fights merge tools. XcodeGen reads this
# YAML file at build time and regenerates a fresh, deterministic
# Basir.xcodeproj. The result: nothing Xcode-specific is committed to
# git, and every dev / every CI machine produces an identical project.
#
# Codemagic runs `xcodegen generate` as the first build step. The
# generated .xcodeproj is then handed to xcodebuild.

name: Basir

options:
  bundleIdPrefix: com.basir
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_LANGUAGE: ar
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Match the Android side's "HTTPS only" posture on release.
    # Info.plist already pins NSAllowsArbitraryLoads=false.

targets:
  Basir:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    info:
      path: Basir/Info.plist

    sources:
      - path: Basir
        excludes:
          - Info.plist

    dependencies:
      - target: BasirShare

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.basir.ai
        PRODUCT_NAME: Basir
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
          ENABLE_BITCODE: NO

  # Share Extension target — receives ACTION_SEND-equivalent payloads
  # from other iOS apps via the iOS share sheet. See
  # Basir/ShareExtension/ShareViewController.swift.
  BasirShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    info:
      path: ShareExtension/Info.plist

    sources:
      - path: ShareExtension

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.basir.ai.share
        PRODUCT_NAME: BasirShare
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # The Share Extension needs the SAME app group as the host app
        # so it can hand files off. Configure the group in Xcode →
        # Capabilities → App Groups → "group.com.basir.shared" on BOTH
        # targets after the first generate.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
